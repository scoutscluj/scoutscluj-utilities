name: Verify member management

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: scoutscluj_test
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/scoutscluj_test
      DATABASE_SSL: 'false'
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter api lint
      - run: pnpm --filter api typecheck
      - run: pnpm --filter api test --runInBand
      - run: pnpm --filter api build
      - name: Render and inspect the supplied fixed agreement
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libreoffice-writer fonts-crosextra-carlito fonts-liberation python3-lxml python3-pypdf python3-reportlab poppler-utils
          pnpm --filter api exec tsx test/fixed-consent.smoke.ts
          pdftoppm -scale-to 1100 -png tmp/fixed-consent/acord.pdf tmp/fixed-consent/page
      - uses: actions/upload-artifact@v4
        with:
          name: fixed-consent-preview
          path: tmp/fixed-consent/
          retention-days: 2
      - name: Verify activity registrations against isolated PostgreSQL
        run: |
          PGPASSWORD=postgres psql -h 127.0.0.1 -U postgres -d postgres -c 'CREATE DATABASE activity_registration_test'
          pnpm --filter api test:activity-registration:postgres
          pnpm --filter api exec node test/activity-registration-module.cjs
        env:
          ACTIVITY_REGISTRATION_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/activity_registration_test
      - name: Migrate a fresh PostgreSQL database and verify persisted member operations
        run: pnpm --filter api exec tsx test/members-postgres.smoke.ts
      - name: Verify private adult document migration and persistence
        run: pnpm --filter api exec tsx test/adult-documents-postgres.smoke.ts
        env:
          ADULT_DOCUMENTS_TEST_ADMIN_URL: postgresql://postgres:postgres@localhost:5432/postgres
      - name: Verify catalog maintenance command completes and is repeatable
        run: |
          timeout 60s pnpm --filter api kitchen:seed:prod
          timeout 60s pnpm --filter api kitchen:seed:prod
      - run: pnpm --filter web typecheck
      - run: pnpm --filter web test
      - run: pnpm --filter web build
      - name: Verify activity registration browser flows
        run: |
          pnpm --filter web exec playwright install --with-deps chromium
          pnpm --filter web exec playwright test --config playwright.registration.config.ts
          pnpm --filter web exec playwright test --config playwright.members.config.ts
          pnpm --filter web exec playwright test --config playwright.profile.config.ts --grep "creates through|validates required"
          pnpm --filter web exec playwright test --config playwright.membership.config.ts e2e/membership-finance.spec.ts --grep "member modal saves cash|receipts modal accepts cash|bank admission can share"
      - run: pnpm --filter infra verify
